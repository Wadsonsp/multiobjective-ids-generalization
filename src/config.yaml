# =====================================================================
# Configuração central dos experimentos da dissertação
# Sistemas de Detecção de Intrusão com Generalização Cross-Dataset
# e Otimização Multiobjetivo (Capítulo 4 - Metodologia)
# =====================================================================

# ---------------------------------------------------------------------
# Datasets (família NF-v2 - Sarhan, Layeghy e Portmann [13])
# Fonte oficial: UQ Research Data Manager (rdm.uq.edu.au)
# Eu mantenho os arquivos localmente na pasta Datasets do projeto.
# ---------------------------------------------------------------------
datasets:
  pasta_local: "Datasets"
  bases:
    NF-UNSW-NB15-v2:
      arquivo: "NF-UNSW-NB15-V2.parquet"
    NF-ToN-IoT-v2:
      arquivo: "NF-ToN-IoT-V2.parquet"

# ---------------------------------------------------------------------
# Pré-processamento (Seção 4.1)
# ---------------------------------------------------------------------
preprocessamento:
  # Atributos descartados por risco de vazamento de informação:
  # Portas funcionam como atalhos de classificação; TTL reflete
  # particularidades de SO e posicionamento dos hosts.
  atributos_vazamento:
    - L4_SRC_PORT
    - L4_DST_PORT
    - MIN_TTL
    - MAX_TTL
  coluna_rotulo: "Attack"      # rótulo multiclasse (categoria de ataque)
  coluna_binaria: "Label"      # rótulo binário (descartado da matriz de atributos)

# ---------------------------------------------------------------------
# Classificador h usado nas duas fases
# ---------------------------------------------------------------------
classificador:
  # Eu uso a árvore de profundidade 8 apresentada na definição original.
  nome: "decision_tree"

# ---------------------------------------------------------------------
# Otimização multiobjetivo - Algoritmo 1 (NSGA-II, Deb et al. [12])
# ---------------------------------------------------------------------
otimizacao:
  n_pop: 24            # Eu uso a população do experimento já realizado.
  n_gen: 15            # Eu uso quinze gerações como critério de parada.
  seed: 42

# ---------------------------------------------------------------------
# Avaliação - Algoritmo 2
# ---------------------------------------------------------------------
avaliacao:
  cv_folds: 5                  # validação cruzada estratificada intra-dataset
  seed: 42

# ---------------------------------------------------------------------
# Saídas
# ---------------------------------------------------------------------
resultados:
  pasta_pareto: "Resultados/pareto"
  pasta_metricas: "Resultados/metricas"
  pasta_logs: "Resultados/logs"
  pasta_checkpoints: "Resultados/checkpoints"
